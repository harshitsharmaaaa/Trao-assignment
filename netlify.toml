# Netlify deployment for the single Next.js App Router application.
# Netlify auto-detects Next.js (v13.5+) and applies its Next Runtime
# automatically — no plugin installation required.
# Required environment variables (Site settings > Environment variables):
#   MONGODB_URI (MongoDB Atlas connection string)
#   JWT_SECRET (long random secret)
#   GEMINI_API_KEY_1 (single production Google Cloud project key)
#   MOCK_LLM=false
#   ALLOW_LOCAL_URLS=false
# NOTE: LLM_PROVIDER / LLM_MODEL are optional runtime-only overrides (code
# defaults: provider=gemini, model=gemini-3.6-flash). Do NOT set them as
# Netlify environment variables — Netlify Secrets Scanning flags dashboard
# values that also appear in the repository/build output.
[build]
  command = "npm run build"
  publish = ".next"
